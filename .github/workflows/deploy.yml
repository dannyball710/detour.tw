name: CI / Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN; nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a production deploy halfway through migrations.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://detour.tw
    # Cloudflare credentials are scoped to the two steps that need them, so dependency install
    # scripts and the build never see them.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations run against the root wrangler.jsonc, before the build writes its redirected config.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply detour --remote
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          test -n "$TOKEN_SECRET" || { echo 'TOKEN_SECRET is not set'; exit 1; }
          test -n "$TURNSTILE_SECRET" || { echo 'TURNSTILE_SECRET is not set'; exit 1; }
          trap 'rm -f "$RUNNER_TEMP/secrets.json"' EXIT
          node -e "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/secrets.json', JSON.stringify({ TOKEN_SECRET: process.env.TOKEN_SECRET, TURNSTILE_SECRET: process.env.TURNSTILE_SECRET }))"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
